<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Goomys</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="/assets/profile.jpg" type="image/jpeg">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme-init.js"></script>
</head>
<body>
    <div class="grid-bg"></div>

    <main class="error-page">
        <div class="brutal-card error-card">
            <p class="error-code" aria-hidden="true">404</p>
            <h1 class="error-title">Page not found</h1>
            <p class="error-desc">
                This page doesn't exist, got moved, or never existed at all. Either way, it's not here.
            </p>
            <div class="error-actions">
                <a href="/" class="brutal-btn primary">Back to Home</a>
                <a href="https://github.com/geoffreyoner" target="_blank" rel="noopener noreferrer" class="brutal-btn secondary">GitHub</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© <span id="footer-year">2026</span> Goomys.</p>
    </footer>

    <script>
        document.getElementById('footer-year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
